# TermProof Rust workspace manifest.
#
# This workspace is the Rust reimplementation of TermProof. The Python
# implementation at https://github.com/md-mt/termproof remains the shipped
# product and the behavioural oracle; this port is not yet a substitute for it.
#
# Policies that govern this workspace (formatting, linting, errors, tracing,
# dependencies, features, unsafe code) are documented in
# docs/engineering-baseline.md.

[workspace]
resolver = "2"
members = [
    "crates/termproof",
    "crates/termproof-cli",
    "crates/termproof-plugin-protocol",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/md-mt/termproof-rust"
homepage = "https://github.com/md-mt/termproof-rust"
authors = ["TermProof maintainers"]
description = "Evidence-first verification for TUI and terminal applications (Rust reimplementation)"

# Workspace-wide lint policy. Every crate inherits these via `[lints] workspace = true`.
# CI enforces `cargo clippy --all-targets --all-features -- -D warnings`, so warnings
# here are effectively denied at the gate. See docs/engineering-baseline.md.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Shared dependency pins. Crates opt in via `foo.workspace = true`.
# No dependency may be added without a documented reason in engineering-baseline.md.
# Reasons (spec §5.3, RUST-004):
# - serde / serde_json — typed data, stable JSON serialization.
# - serde_yaml — YAML recipe/config loading (JSON+YAML inputs).
# - schemars — source-to-schema generator, Draft 2020-12.
# - jsonschema — Draft 2020-12 validation.
# - thiserror — typed internal errors converted at boundaries.
# - portable-pty / vt100 — real controlling tty and terminal emulation (RUST-006).
#
# Internal crates carry both `path` and `version`. The path is what a local
# build resolves against; the version is what the published package resolves
# against on the registry. A `path`-only dependency cannot be published at all,
# and the two must be bumped together — see docs/publishing.md.
#
# A requirement here is a *floor*, not a preference: the lowest version this
# code compiles and passes the differential harnesses against. A floor written
# higher than it needs to be costs a vendoring consumer a second copy of the
# crate for nothing, so where one sits above the oldest workable version there
# is a comment naming the API that put it there (#28). The `test at the declared
# dependency floors` step in .github/workflows/rust.yml runs the suite at each
# floor, so a floor that stops being true fails CI rather than rotting quietly.
[workspace.dependencies]
termproof = { path = "crates/termproof", version = "0.3.0" }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
# Floor 0.16, tested at 0.16.2. `jsonschema` 0.33 asks for `^0.16` itself, so a
# caret on 0.19 put two copies of a backtracking regex engine in the graph of
# every default build — ours and its — which pinning to 0.16.2 now collapses.
# Nothing here needs 0.19: the one thing that did was a type annotation naming
# `Captures`, which gained a haystack parameter in 0.19 and is now left to
# inference (see `steps::try_match`).
fancy-regex = ">=0.16, <0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Held at 0.8, decided in #28. Not for lack of trying: 1.2.1 builds on a single
# import rename, needs no edit at any derive site, passes the whole suite, and
# even improves assertion parity 124/147 -> 126/147. It is held anyway, for two
# reasons, of which the second is the stronger.
#
# 1. `JsonSchema` is derived on `Recipe`, `CommandSpec`, `Step`, `Assertion` and
#    the config types, so the trait is part of this crate's published surface
#    and its major is a break for any consumer that names them. Releases here
#    bump the patch digit only.
#
# 2. `preserve_order` does not mean the same thing across the majors, and the
#    difference is graph-global. In 0.8 it is `["indexmap"]`, scoped to
#    schemars' own maps. In 1.x it is `["serde_json/preserve_order"]`, which
#    switches `serde_json::Map` to insertion order for *every* crate in the
#    consumer's build. Imposing that on unrelated crates is not ours to do on a
#    consumer's behalf. It is also where both parity wins come from — Python
#    dicts preserve insertion order too — which makes them a symptom of the
#    side effect rather than a benefit of the upgrade.
#
# The bump also silently redraws the generated recipe schema: `definitions`
# becomes `$defs` with every `$ref` retargeted, `"minimum": 0.0` becomes
# `"minimum": 0`, and key order and the `required` array go from sorted to
# declaration order. The three tests in `schema.rs` catch none of it — they
# check `$schema`, two `required` entries and one const. A change of that shape
# passing green is the argument for a real drift test; the canonical schema
# lives in the Python tree and is deliberately not vendored here, so building
# one is parity-gate work and is not done.
#
# What #28 shipped instead is the `schema` feature on the `termproof` crate: a
# consumer that does not need generation stops compiling `schemars` at all,
# which answers "every consumer with a modern schemars carries two" without
# breaking anyone's types.
schemars = { version = "0.8", features = ["preserve_order"] }
# Floor 0.32, tested at 0.32.0. 0.31 is the first version that will not build:
# `ValidationErrorKind::OneOfMultipleValid` has no `context` field there, and
# `pyschema` reads it to rank sub-errors the way Python's `best_match` does,
# which FR-017 pins down. Below 0.31 more of the same API is missing —
# `AnyOf`/`OneOfNotValid` contexts and `PrimitiveTypesBitMap::iter` at 0.29,
# `Validator::iter_errors` as well at 0.24.
jsonschema = { version = ">=0.32, <0.34" }
# 0.9, not 0.8, because `ExitStatus::signal()` is 0.9's. 0.8.1 keeps the signal
# name in a private field with no accessor, so on 0.8 a child killed by a signal
# reports an exit code and nothing else — `Session::exit_signal` would have to
# go. Widening this one costs a feature, so it stays (#28).
portable-pty = "0.9"
vt100 = "0.16"
quick-junit = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
unicode-normalization = "0.1"
# Must track the major that `vt100` depends on. Our own width decisions and
# vt100's cell layout have to come from one Unicode table, or the same byte
# stream lands in a different column depending on which path read it — see the
# note on width tables in `terminal::attributed`.
#
# So this is not widenable while `vt100` is 0.16: that asks for `^0.2.1`, and a
# floor of 0.1 here would resolve to a second copy *and* a second table, which
# is both halves of what the requirement exists to prevent (#28).
unicode-width = "0.2"
tempfile = "3.10"
thiserror = "2.0"
avt = "0.16"
chrono = "0.4"
globset = "0.4"
clap = { version = "4.5", features = ["derive"] }
termproof-plugin-protocol = { path = "crates/termproof-plugin-protocol", version = "0.3.0" }
