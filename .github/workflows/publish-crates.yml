# Publishes this workspace's crates to crates.io when a GitHub release is
# published. Nothing else in this repository uploads to a registry.
#
# The publish set and its order are derived at run time from `cargo metadata`
# by .github/scripts/publish-plan.py: the crates whose `publish` is not false,
# topologically ordered. Holding a crate back, adding one, or merging several
# into one is a manifest change, and this workflow follows it without an edit.
# Nothing here names a crate.
#
# Only a published GitHub release uploads anything. `workflow_dispatch` and
# `pull_request` runs are always dry runs — there is no input to flip, so this
# workflow cannot be hand-triggered into publishing. To retry a release that
# failed partway, re-run this workflow from the release; the publish step is
# idempotent and will skip what already landed.
#
# ## Why the upload is its own job
#
# The upload runs in the `crates-io` GitHub environment. Entering an
# environment is what creates a deployment record, and — the day someone adds
# a reviewer or a wait timer to it — what makes a run pause for approval.
# Neither should happen on a pull request or a hand-triggered rehearsal, so the
# dry run cannot share a job with the upload: a job-level `environment:` has no
# `if:` of its own and would apply to every event this workflow accepts. Two
# jobs, each guarded on `github.event_name`, is the only shape where the
# environment covers exactly the path that publishes.
#
# The registry token stays a *repository* secret. Repository secrets are
# visible to a job targeting an environment, so `secrets.CARGO_REGISTRY_TOKEN`
# resolves here exactly as it did before — an environment adds a place a secret
# of the same name could be defined, it does not move the one that exists.
#
# See docs/publishing.md.
name: Publish (crates.io)

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      order: ${{ steps.plan.outputs.order }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: "1.96.0"

      - name: Derive the publish set and order
        id: plan
        run: |
          PLAN="$(.github/scripts/publish-plan.py)"
          VERSION="$(jq -r .version <<<"$PLAN")"
          ORDER="$(jq -r '.order | join(" ")' <<<"$PLAN")"
          HELD="$(jq -r '.held | join(" ")' <<<"$PLAN")"
          {
            echo "version=$VERSION"
            echo "order=$ORDER"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Publish plan"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Order: \`${ORDER:-(none)}\`"
            echo "- Held back (\`publish = false\`): \`${HELD:-(none)}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # A tag and a manifest that disagree is the commonest way a release goes
      # out mislabelled, and it is the cheapest thing to check — so it runs
      # before the test suite, not after it. The required format is `v<version>`
      # because release-rust.yml already triggers on `v*.*.*`; accepting a bare
      # `0.2.1` too would let a tag exist that publishes crates but never builds
      # the binaries, which is a worse outcome than a rejected tag.
      - name: Refuse a tag that disagrees with the manifest
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag '$TAG' does not match the workspace version '$VERSION' — expected 'v$VERSION'. Fix the tag, or bump the version in Cargo.toml and re-cut the release."
            exit 1
          fi
          echo "tag '$TAG' matches workspace version '$VERSION'"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check --all
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --workspace --release

  # Verifies every publishable package by building it from its own tarball,
  # with the not-yet-published ones overlaid in a temporary local registry.
  # `--workspace` skips `publish = false` crates on its own. This is what runs
  # on pull requests, so the workflow is exercised before a release depends on
  # it. It uploads nothing, so it takes no token and enters no environment.
  dry-run:
    name: Dry run
    needs: [plan, gate]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: "1.96.0"

      - name: Dry run
        run: cargo publish --dry-run --workspace

  # The only job in this repository that uploads to a registry, and the only
  # one in an environment. See the header for why it is not the dry run's `if:`
  # on a shared job.
  publish:
    name: Publish
    needs: [plan, gate]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: "1.96.0"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ORDER: ${{ needs.plan.outputs.order }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/scripts/publish.sh
