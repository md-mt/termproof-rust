name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test (Rust ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check --all
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace
      # `--all-features` cannot catch a feature that only builds alongside
      # another, which is the failure mode an undeclared `dep:` produces. With
      # three features the powerset is eight, so check all of it rather than a
      # sample (#27, extended for `schema` in #28). `json-schema` implies
      # `schema`, so two of the eight resolve to the same set — they are run
      # anyway, because what is being checked is that every combination a
      # consumer can *write* compiles, not every set cargo can resolve.
      # `default` and `--all-features` are the same set today and the steps
      # above already cover them.
      - name: clippy and test each feature combination
        run: |
          set -eux
          for features in "" "evidence" "json-schema" "schema" \
                          "evidence,json-schema" "evidence,schema" \
                          "json-schema,schema" "evidence,json-schema,schema"; do
            cargo clippy -p termproof --all-targets \
              --no-default-features --features "$features" -- -D warnings
            cargo test -p termproof --no-default-features --features "$features"
          done
      # A widened requirement is a claim that the code works at the bottom of
      # the range, and nothing above tests that: the committed lockfile resolves
      # every range to its top. So each floor widened in #28 is pinned here and
      # the suite is run against it. Rewriting the requirement to `=` beats
      # `cargo update --precise`, which cannot name a crate the graph contains
      # twice — which is exactly the fancy-regex case this widening exists to
      # let a consumer collapse. Last step in the job: it dirties Cargo.toml
      # and Cargo.lock, and the checkout is thrown away straight after.
      - name: test at the declared dependency floors
        run: |
          set -eux
          perl -pi -e 's{^fancy-regex = .*}{fancy-regex = "=0.16.2"}' Cargo.toml
          perl -pi -e 's{^jsonschema = .*}{jsonschema = "=0.32.0"}' Cargo.toml
          cargo test --workspace
