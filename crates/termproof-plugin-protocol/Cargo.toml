[package]
name = "termproof-plugin-protocol"
description = "Versioned newline-delimited JSON plugin protocol for TermProof, with client, host and conformance support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
# Not docs.rs: this crate is not published, so there would be nothing there.
documentation = "https://github.com/md-mt/termproof-rust#readme"
keywords = ["terminal", "plugin", "protocol", "jsonl", "ipc"]
categories = ["development-tools::testing", "encoding", "api-bindings"]
# Held back from crates.io on purpose — see docs/publishing.md. The metadata
# above is complete and stays complete, so lifting this line is the only change
# needed to publish. The release workflow derives its publish set from this
# field at run time, so nothing else has to be edited either.
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
termproof-core.workspace = true
termproof-terminal.workspace = true
