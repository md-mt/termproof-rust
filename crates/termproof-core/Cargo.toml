[package]
name = "termproof-core"
description = "Recipe model, schema, validation, planning, steps, assertions, selection and run orchestration for TermProof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/termproof-core"
keywords = ["terminal", "tui", "testing", "verification", "cli"]
categories = ["development-tools::testing", "development-tools", "command-line-interface"]
# The differential tests replay `harness/corpus/`, which lives at the repository
# root and is deliberately not shipped (~150 KB of recorded oracle output that no
# consumer of the library needs). Without the corpus these two tests cannot run,
# so they stay out of the tarball too. Every other test here is self-contained.
exclude = ["tests/differential_steps.rs", "tests/differential_assertions.rs"]

[lints]
workspace = true

[dependencies]
regex.workspace = true
fancy-regex.workspace = true
serde.workspace = true
globset.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
jsonschema.workspace = true
sha2.workspace = true
chrono.workspace = true
tempfile.workspace = true
thiserror.workspace = true
termproof-terminal.workspace = true
